services:
  maptoposter:
    image: ghcr.io/alivebe-a11y/3dmap:latest
    container_name: maptoposter
    ports:
      - "5025:5025"
    volumes:
      - ./posters:/app/posters
      - ./cache:/app/cache
      - ./badges:/app/badges
      - ./stadium_data.py:/app/stadium_data.py
      - ./overlays_cache:/app/overlays_cache
    environment:
      - MAPBOX_TOKEN=${MAPBOX_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

networks: {}
