<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapToPoster</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css' rel='stylesheet' />
</head>

<body>
    <div class="container">
        <h1>MapToPoster Generator</h1>
        <div class="main-content">
            <div class="card control-panel">
                <form id="mapForm">
                    <div class="mode-tabs">
                        <button type="button" class="tab-btn active" id="tabCity" onclick="setMode('city')">City</button>
                        <button type="button" class="tab-btn" id="tabStadium" onclick="setMode('stadium')">Stadium</button>
                    </div>

                    <div id="cityFields">
                        <label>City <input type="text" id="city" placeholder="e.g. Manchester"></label>
                        <label>Country <input type="text" id="country" placeholder="e.g. UK"></label>
                    </div>
                    <div id="stadiumFields" class="hidden">
                        <label>Stadium
                            <input type="text" id="stadium" list="stadiumList" placeholder="e.g. Old Trafford">
                            <datalist id="stadiumList">
                                {% for s in stadiums %}<option value="{{ s }}">{% endfor %}
                            </datalist>
                        </label>
                        <label>Badge
                            <select id="badge">
                                <option value="">No badge</option>
                                {% for b in badges %}<option value="{{ b }}">{{ b }}</option>{% endfor %}
                            </select>
                        </label>
                    </div>

                    <div class="theme-group">
                        <span class="theme-label">Theme</span>
                        <button type="button" id="selectAllThemes" class="btn-select-all">Select All</button>
                        <select multiple id="theme" size="6">
                            {% for theme in themes %}<option value="{{ theme }}">{{ theme }}</option>{% endfor %}
                        </select>
                    </div>

                    <label>Zoom (<span id="radiusVal">15</span> km)
                        <input type="range" id="radius" min="1000" max="50000" step="1000" value="15000">
                    </label>

                    <div class="toggle-group">
                        <label class="toggle-label">
                            <input type="checkbox" id="enable3d">
                            <span>Enable 3D Landmark Overlay</span>
                        </label>
                    </div>

                    <div id="controls3d" class="controls-3d hidden">
                        <label>Latitude
                            <input type="number" id="lat3d" step="0.00001" placeholder="e.g. 53.46308">
                        </label>
                        <label>Longitude
                            <input type="number" id="lon3d" step="0.00001" placeholder="e.g. -2.29133">
                        </label>
                        <label>Lighting
                            <select id="lightPreset">
                                <option value="dawn">Dawn</option>
                                <option value="day">Day</option>
                                <option value="dusk" selected>Dusk</option>
                                <option value="night">Night</option>
                            </select>
                        </label>
                        <label>3D Zoom
                            <input type="range" id="zoom3d" min="14" max="19" step="0.1" value="16.91">
                            <span id="zoom3dVal">16.9</span>
                        </label>
                        <label>Pitch
                            <input type="range" id="pitch3d" min="0" max="85" step="1" value="49">
                            <span id="pitch3dVal">49°</span>
                        </label>
                        <label>Bearing
                            <input type="range" id="bearing3d" min="-180" max="180" step="1" value="0">
                            <span id="bearing3dVal">0°</span>
                        </label>
                        <label>Overlay Size
                            <select id="overlaySize">
                                <option value="small">Small (20%)</option>
                                <option value="medium" selected>Medium (35%)</option>
                                <option value="large">Large (50%)</option>
                            </select>
                        </label>
                        <label class="toggle-label">
                            <input type="checkbox" id="overlayTint">
                            <span>Tint 3D to match theme</span>
                        </label>
                        <button type="button" id="preview3dBtn" class="btn-preview">Preview 3D</button>
                    </div>

                    <button type="submit" id="generateBtn">Generate Poster</button>
                    <div id="errorMsg" class="error"></div>
                </form>
            </div>
            <div class="card result-panel">
                <div id="loader" class="hidden">🔄 Generating... (Please wait)</div>
                <div id="batchMsg" class="batch-success hidden"></div>
                <div id="preview3dContainer" class="hidden">
                    <p class="preview-label">3D Landmark Preview</p>
                    <div id="mapbox-container"></div>
                </div>
                <img id="resultImage" class="hidden">
                <a id="downloadLink" href="#" class="btn-download hidden">⬇️ Download PNG</a>
            </div>
        </div>
    </div>

    <!-- Hidden offscreen map for high-res capture -->
    <div id="mapbox-capture" style="position:absolute;left:-9999px;top:-9999px;width:4096px;height:4096px;background:#050505;"></div>

    <script>window.MAPBOX_TOKEN = "{{ mapbox_token }}";</script>
    <script>window.STADIUMS = {{ stadiums_json | safe }};</script>
    <script src="/static/script.js"></script>
</body>

</html>
